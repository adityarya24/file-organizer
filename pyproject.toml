[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-file-organizer"
version = "1.0.0"
description = "A fast, zero-dependency, background-capable file organizer for Downloads & Desktop with undo/rollback support."
readme = "README.md"
authors = [{ name = "Aditya Arya" }]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["file-organizer", "downloads", "desktop-cleanup", "automation", "productivity", "python"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.scripts]
file-organizer = "organizer:main"

[project.urls]
Homepage = "https://github.com/adityarya24/file-organizer"
Repository = "https://github.com/adityarya24/file-organizer.git"
"Bug Tracker" = "https://github.com/adityarya24/file-organizer/issues"
